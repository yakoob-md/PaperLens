services:
  - type: web
    name: paperlens-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MCP_ENABLED
        value: "true"
      - key: PORT
        value: "8000"
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
